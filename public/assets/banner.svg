<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="banner-s-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)" />
  <circle cx="200" cy="80" r="260" fill="url(#glow-grad)" />
  <circle cx="1000" cy="300" r="220" fill="url(#glow-grad)" />

  <!-- Grid decoration lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="560" y1="0" x2="560" y2="400" />
    <line x1="720" y1="0" x2="720" y2="400" />
    <line x1="880" y1="0" x2="880" y2="400" />
    <line x1="1040" y1="0" x2="1040" y2="400" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Left Content -->
  <g transform="translate(80, 80)">
    <!-- Small Category Pill -->
    <rect width="180" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="18" cy="15" r="4.5" fill="#10b981"/>
    <text x="32" y="20" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5px">SUBSCRIPTION HQ</text>

    <!-- Main Title -->
    <text x="0" y="80" font-family="Inter, sans-serif" font-size="48" font-weight="800" fill="#ffffff" letter-spacing="-1px">
      Subscript<tspan fill="#818cf8">ly</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      Your recurring expense &amp; free trial command center.
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="130" height="32" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="14" y="21" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">⚡ Trial Expiries</text>

      <rect x="142" y="0" width="140" height="32" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="156" y="21" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">💳 Multi-Card Alloc</text>

      <rect x="294" y="0" width="136" height="32" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="308" y="21" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">🔒 100% Private</text>
    </g>
  </g>

  <!-- Right Hero Card Simulation -->
  <g transform="translate(680, 50)" filter="url(#card-shadow)">
    <!-- Base App Window Mockup -->
    <rect width="450" height="300" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window Bar -->
    <rect width="450" height="42" rx="16" fill="#1e293b" />
    <circle cx="24" cy="21" r="5" fill="#f43f5e" />
    <circle cx="40" cy="21" r="5" fill="#f59e0b" />
    <circle cx="56" cy="21" r="5" fill="#10b981" />
    <text x="80" y="26" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#64748b">Subscriptly — Subscription Command Center</text>

    <!-- Stat Card 1 -->
    <g transform="translate(24, 60)">
      <rect width="188" height="90" rx="12" fill="#1e293b" stroke="#334155" />
      <text x="16" y="26" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">MONTHLY SPEND</text>
      <text x="16" y="58" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#ffffff">₹4,290</text>
      <text x="16" y="76" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#10b981">↓ 18% with coupons</text>
    </g>

    <!-- Stat Card 2 -->
    <g transform="translate(228, 60)">
      <rect width="198" height="90" rx="12" fill="#1e293b" stroke="#334155" />
      <text x="16" y="26" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#f59e0b">⚠ TRIAL ENDING</text>
      <text x="16" y="58" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Spotify Premium</text>
      <text x="16" y="76" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Ends in 2 days → ₹119/mo</text>
    </g>

    <!-- Upcoming List Row Mockup -->
    <g transform="translate(24, 166)">
      <rect width="402" height="52" rx="10" fill="#182234" stroke="#253248" />
      <rect x="12" y="10" width="32" height="32" rx="8" fill="#e11d48" fill-opacity="0.2" />
      <text x="22" y="31" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#f43f5e">N</text>
      <text x="56" y="25" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Netflix Premium</text>
      <text x="56" y="40" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#64748b">Visa •••• 4821 · Monthly</text>
      <text x="320" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">₹649</text>
      <text x="320" y="40" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#38bdf8">In 3 days</text>
    </g>

    <!-- Upcoming List Row 2 -->
    <g transform="translate(24, 226)">
      <rect width="402" height="52" rx="10" fill="#182234" stroke="#253248" />
      <rect x="12" y="10" width="32" height="32" rx="8" fill="#0284c7" fill-opacity="0.2" />
      <text x="19" y="31" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">iC</text>
      <text x="56" y="25" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#ffffff">iCloud+ 50GB</text>
      <text x="56" y="40" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#64748b">Apple Pay · Monthly</text>
      <text x="330" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">₹75</text>
      <text x="320" y="40" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">In 12 days</text>
    </g>
  </g>
</svg>
