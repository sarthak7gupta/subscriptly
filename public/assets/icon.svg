<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="sq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Top Card / Primary Spend (Indigo to Violet) -->
    <linearGradient id="card-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Lower Card / Renewal Flow (Cyan to Mint) -->
    <linearGradient id="card-bot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Dimensional Diagonal Fold -->
    <linearGradient id="fold-link" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>

    <!-- Micro Drop Shadow -->
    <filter id="mark-depth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#sq-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- S-Vault Brandmark -->
  <g filter="url(#mark-depth)">
    <!-- Diagonal Connecting Bridge (Underneath) -->
    <path d="M28 17L18 31H24L34 17H28Z" fill="url(#fold-link)" />

    <!-- Top Card Silhouette (Upper Loop of 'S') -->
    <rect x="11" y="11" width="24" height="11" rx="4" fill="url(#card-top)" />
    <!-- Top Card Micro-Chip / Cutout Accent -->
    <circle cx="16" cy="16.5" r="1.5" fill="#ffffff" fill-opacity="0.8" />
    <path d="M21 15H29" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.2" stroke-linecap="round" />

    <!-- Bottom Card Silhouette (Lower Loop of 'S') -->
    <rect x="13" y="26" width="24" height="11" rx="4" fill="url(#card-bot)" />
    <!-- Bottom Card Micro-Chip / Cutout Accent -->
    <circle cx="32" cy="31.5" r="1.5" fill="#ffffff" fill-opacity="0.8" />
    <path d="M19 33H27" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>