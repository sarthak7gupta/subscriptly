<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48" fill="none">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="sq-bg-d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Top Card / Primary Spend (Indigo to Violet) -->
    <linearGradient id="card-top-d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Lower Card / Renewal Flow (Cyan to Mint) -->
    <linearGradient id="card-bot-d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Dimensional Diagonal Fold -->
    <linearGradient id="fold-link-d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>

    <!-- Micro Drop Shadow -->
    <filter id="mark-depth-d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 1:1 Matched S-Vault Brandmark -->
  <svg x="4" y="4" width="40" height="40" viewBox="0 0 48 48">
    <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#sq-bg-d)" stroke="#334155" stroke-width="1.5" />
    <g filter="url(#mark-depth-d)">
      <path d="M28 17L18 31H24L34 17H28Z" fill="url(#fold-link-d)" />
      <rect x="11" y="11" width="24" height="11" rx="4" fill="url(#card-top-d)" />
      <circle cx="16" cy="16.5" r="1.5" fill="#ffffff" fill-opacity="0.85" />
      <path d="M21 15H29" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.2" stroke-linecap="round" />
      <rect x="13" y="26" width="24" height="11" rx="4" fill="url(#card-bot-d)" />
      <circle cx="32" cy="31.5" r="1.5" fill="#ffffff" fill-opacity="0.85" />
      <path d="M19 33H27" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.2" stroke-linecap="round" />
    </g>
  </svg>

  <!-- Typography: Subscriptly (Approved Wordmark - Dark Mode) -->
  <text x="56" y="29" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" letter-spacing="-0.5px" fill="#ffffff">
    Subscript<tspan fill="#818cf8">ly</tspan>
  </text>
  
  <!-- Subtle Tagline Badge -->
  <rect x="56" y="33" width="76" height="11" rx="3" fill="#1e1b4b" stroke="#3730a3" stroke-width="0.8" />
  <text x="59" y="41" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" letter-spacing="0.6px" fill="#818cf8">
    SUBSCRIPTION HQ
  </text>
</svg>